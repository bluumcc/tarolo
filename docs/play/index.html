html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
// A engine do Godot mede window.innerWidth/innerHeight pra decidir o tamanho do canvas. No
// Safari do iPhone esses dois valores representam a tela "grande", como se a barra de
// endereço/gestos não existisse — ela fica só POR CIMA do conteúdo sem afetar innerHeight.
// Resultado: o canvas nasce maior que a área que dá pra tocar de verdade, e qualquer coisa
// perto da borda (como o rodapé de um popup) fica desenhada embaixo da barra, inalcançável.
// window.visualViewport.height/width já refletem a área realmente visível. Só troca a MEDIDA
// (sem escutar evento nenhum, pra nunca competir com um arrasto em andamento): a própria engine
// já releria isso sozinha a cada quadro.
// Teclado virtual: quando ele abre, o visualViewport encolhe (>150px de uma vez) e o canvas era
// redimensionado pra área que sobrou — o jogo inteiro espremia, e voltava ao fechar. Detectamos o
// teclado só pelo tamanho (nada de eventos de foco, que ficam trocando a cada toque): se a altura
// visível é bem menor que a maior já vista com a mesma largura, seguimos reportando a maior.
// Mudanças pequenas (barra de endereço do Safari) continuam sendo seguidas normalmente.
var __fullH = 0, __lastW = 0;
function __vvSize() {
	var w = Math.round(window.visualViewport.width);
	var h = Math.round(window.visualViewport.height);
	if (w !== __lastW) { __lastW = w; __fullH = h; }
	else if (__fullH - h > 150) { return { w: w, h: __fullH }; }
	else { __fullH = h; }
	return { w: w, h: h };
}
document.addEventListener('focusout', function () {
	setTimeout(function () {
		var a = document.activeElement && document.activeElement.tagName;
		if (a !== 'INPUT' && a !== 'TEXTAREA') { window.scrollTo(0, 0); }
	}, 80);
}, true);
if (window.visualViewport) {
	Object.defineProperty(window, 'innerHeight', {
		configurable: true,
		get: function () { return __vvSize().h; },
	});
	Object.defineProperty(window, 'innerWidth', {
		configurable: true,
		get: function () { return __vvSize().w; },
	});
}

// Teclado virtual no celular: o navegador só abre o teclado se o campo receber foco DENTRO do
// toque do usuário. O Godot só foca o campo dele no quadro seguinte (fora do toque), então nada
// aparece. Truque: o jogo avisa (window.__vk) que o dedo está sobre um campo de texto; no
// touchend, ainda dentro do gesto, focamos um <input> nosso — o teclado abre e, quando o Godot
// focar o dele, o teclado continua aberto.
(function () {
	var helper = null;
	function make() {
		helper = document.createElement('input');
		helper.type = 'text';
		helper.setAttribute('autocomplete', 'off');
		helper.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;z-index:-1;';
		document.body.appendChild(helper);
	}
	function onEnd() {
		if (!window.__vk) { return; }
		window.__vk = false;
		if (!helper) { make(); }
		helper.focus();
		setTimeout(function () { if (document.activeElement === helper) { helper.blur(); } }, 600);
	}
	document.addEventListener('touchend', onEnd, true);
})();
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":14614768,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
